spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: proximity-credit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/proximity_credit}
    username: ${DB_USER:proximity_credit}
    password: ${DB_PASSWORD:proximity-credit-local}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 2
      pool-name: proximity-credit
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false

app:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
    scenarios: ${DEMO_SCENARIOS_ENABLED:false}
    password: ${DEMO_ACCOUNT_PASSWORD:password}
  demo-clock:
    enabled: ${DEMO_CLOCK_ENABLED:false}
    date: ${DEMO_CLOCK_DATE:2026-11-26}
  auth:
    jwt-secret: ${JWT_SECRET:}
